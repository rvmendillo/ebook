name: Admin web app (GitHub Pages)

# Builds the admin studio. On the default branch it is deployed to GitHub Pages
# (enable once: Settings → Pages → Source: "GitHub Actions").

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'apps/admin/**'
      - 'shared/**'
      - 'content/**'
      - '.github/workflows/admin.yml'
  workflow_dispatch:

concurrency:
  group: admin-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # Optional: bake your Supabase project into the build (publishable values only).
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/admin/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        # Pages must be switched on once by a repo admin; don't fail the build until then.
        continue-on-error: true
      - name: How to enable GitHub Pages
        if: steps.deployment.outcome == 'failure'
        run: |
          echo "::warning title=GitHub Pages is not enabled::Enable it once in Settings → Pages → Build and deployment → Source: GitHub Actions, then re-run this workflow. Until then, download the admin build from this run's 'github-pages' artifact."
