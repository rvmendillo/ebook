name: Admin iOS app (IPA)

# Packages the admin studio (apps/admin) as a native iPhone/iPad app with Capacitor.
#  - Always: an UNSIGNED .ipa (sideload with AltStore / Sideloadly).
#  - With signing secrets: a signed .ipa you can send to TestFlight for yourself and
#    your team (internal testing needs no App Review). It re-uses the main app's
#    distribution certificate plus its own provisioning profile:
#      IOS_TEAM_ID, IOS_DIST_CERT_P12_BASE64, IOS_DIST_CERT_PASSWORD,
#      IOS_ADMIN_PROVISIONING_PROFILE_BASE64  (App Store profile for the admin bundle id)

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
    paths:
      - 'apps/admin/**'
      - 'shared/**'
      - '.github/workflows/admin-ios.yml'
  workflow_dispatch:
    inputs:
      testflight:
        description: Upload the signed build to TestFlight (needs signing + App Store Connect API secrets)
        type: boolean
        default: false

concurrency:
  group: admin-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ipa:
    name: Build admin IPA
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/admin
    env:
      ADMIN_BUNDLE_ID: ${{ vars.ADMIN_BUNDLE_ID || 'com.rvmendillo.polymath.admin' }}
      APP_VERSION: ${{ vars.APP_VERSION || '1.0.0' }}
      APP_BUILD_NUMBER: ${{ github.run_number }}
      HAS_SIGNING: ${{ secrets.IOS_DIST_CERT_P12_BASE64 != '' && secrets.IOS_ADMIN_PROVISIONING_PROFILE_BASE64 != '' && secrets.IOS_TEAM_ID != '' }}
      HAS_ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_ID != '' && secrets.APP_STORE_CONNECT_ISSUER_ID != '' && secrets.APP_STORE_CONNECT_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build the admin web app
        run: npm run build
        env:
          # Optional: pre-connect the app to your Supabase project (publishable values only).
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}

      - name: Copy the web build into the iOS project (Capacitor)
        run: npx cap sync ios

      - name: Import signing certificate and provisioning profile
        if: env.HAS_SIGNING == 'true'
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_ADMIN_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Archive
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -o pipefail
          if [ "$HAS_SIGNING" = "true" ]; then
            SIGNING=(CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME")
          else
            SIGNING=(CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="")
          fi
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/build/Admin.xcarchive" \
            PRODUCT_BUNDLE_IDENTIFIER="$ADMIN_BUNDLE_ID" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$APP_BUILD_NUMBER" \
            "${SIGNING[@]}" 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E --line-buffered '(error|BUILD|ARCHIVE|\*\*)' || true
          test -d "$RUNNER_TEMP/build/Admin.xcarchive/Products/Applications" || (tail -n 200 "$RUNNER_TEMP/xcodebuild.log"; exit 1)

      - name: Package unsigned IPA
        if: env.HAS_SIGNING != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload" "$GITHUB_WORKSPACE/dist"
          cp -R "$RUNNER_TEMP"/build/Admin.xcarchive/Products/Applications/*.app "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/dist/PolymathAdmin-${APP_VERSION}-${APP_BUILD_NUMBER}-unsigned.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/dist"

      - name: Export signed IPA
        if: env.HAS_SIGNING == 'true'
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>${ADMIN_BUNDLE_ID}</key><string>${PROFILE_NAME}</string></dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/build/Admin.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$RUNNER_TEMP"/export/*.ipa "$GITHUB_WORKSPACE/dist/PolymathAdmin-${APP_VERSION}-${APP_BUILD_NUMBER}.ipa"

      - name: Upload to TestFlight
        if: env.HAS_SIGNING == 'true' && env.HAS_ASC_KEY == 'true' && inputs.testflight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          xcrun altool --upload-app --type ios \
            --file "$GITHUB_WORKSPACE/dist/PolymathAdmin-${APP_VERSION}-${APP_BUILD_NUMBER}.ipa" \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: admin-ios-ipa-${{ github.run_number }}
          path: dist/*.ipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: admin-ios-xcodebuild-log-${{ github.run_number }}
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.ipa

      - name: Clean up keychain
        if: always() && env.HAS_SIGNING == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
