name: Android build (APK + AAB)

# Builds an installable APK and a Play Store bundle (AAB).
# Without the ANDROID_* signing secrets the release build is signed with the debug key
# (fine for testing / sideloading); with them it is signed with your upload key.

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
    paths:
      - 'apps/mobile/**'
      - 'shared/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    name: Build APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/mobile
    env:
      APP_NAME: ${{ vars.APP_NAME || 'Polymath' }}
      APP_BUNDLE_ID: ${{ vars.APP_BUNDLE_ID || 'com.rvmendillo.polymath' }}
      APP_VERSION: ${{ vars.APP_VERSION || '1.0.0' }}
      APP_BUILD_NUMBER: ${{ github.run_number }}
      ADMOB_IOS_APP_ID: ${{ secrets.ADMOB_IOS_APP_ID }}
      ADMOB_ANDROID_APP_ID: ${{ secrets.ADMOB_ANDROID_APP_ID }}
      HAS_UPLOAD_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Write app environment (.env)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
          RC_IOS: ${{ secrets.REVENUECAT_IOS_KEY }}
          RC_ANDROID: ${{ secrets.REVENUECAT_ANDROID_KEY }}
          AD_ANDROID_REWARDED: ${{ secrets.ADMOB_ANDROID_REWARDED }}
          AD_ANDROID_INTERSTITIAL: ${{ secrets.ADMOB_ANDROID_INTERSTITIAL }}
          AD_ANDROID_BANNER: ${{ secrets.ADMOB_ANDROID_BANNER }}
        run: |
          {
            echo "EXPO_PUBLIC_SUPABASE_URL=$SUPABASE_URL"
            echo "EXPO_PUBLIC_SUPABASE_KEY=$SUPABASE_KEY"
            echo "EXPO_PUBLIC_REVENUECAT_IOS_KEY=$RC_IOS"
            echo "EXPO_PUBLIC_REVENUECAT_ANDROID_KEY=$RC_ANDROID"
            echo "EXPO_PUBLIC_ADMOB_ANDROID_REWARDED=$AD_ANDROID_REWARDED"
            echo "EXPO_PUBLIC_ADMOB_ANDROID_INTERSTITIAL=$AD_ANDROID_INTERSTITIAL"
            echo "EXPO_PUBLIC_ADMOB_ANDROID_BANNER=$AD_ANDROID_BANNER"
          } > .env
          echo "Mode: $([ -n "$SUPABASE_URL" ] && echo live library || echo sample library), $([ -n "$RC_ANDROID" ] && echo store purchases || echo simulated purchases)"

      - name: Generate the native Android project (Expo prebuild)
        run: npx expo prebuild --platform android --clean
        env:
          CI: 1

      - name: Configure upload key
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          mkdir -p ~/.gradle
          {
            echo "POLYMATH_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks"
            echo "POLYMATH_UPLOAD_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "POLYMATH_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
            echo "POLYMATH_UPLOAD_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } >> ~/.gradle/gradle.properties

      - name: Build release APK and AAB
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease bundleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64

      - name: Collect outputs
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          SUFFIX=$([ "$HAS_UPLOAD_KEY" = "true" ] && echo "" || echo "-debugsigned")
          cp android/app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist/${APP_NAME}-${APP_VERSION}-${APP_BUILD_NUMBER}${SUFFIX}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/dist/${APP_NAME}-${APP_VERSION}-${APP_BUILD_NUMBER}${SUFFIX}.aab"
          ls -lh "$GITHUB_WORKSPACE/dist"

      - name: Upload APK + AAB
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
